name: iPhone simulator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iphone:
    # The hosted ARM64 simulator rejected the app's verified signature during dyld startup.
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet-ios
        with:
          dotnet-version: '10.0.203'
      - name: Select Xcode and install the iOS workload
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.4.1.app/Contents/Developer
          xcodebuild -version
          dotnet workload install maui-ios --version 10.0.203.1
      - name: Build the iPhone simulator app
        run: >-
          dotnet build samples/LavPulse/LavPulse.csproj
          -c Debug
          -p:LavPulsePlatform=ios
          -p:RuntimeIdentifier=iossimulator-x64
          -p:EnableCodeSigning=false
      - name: Launch LavPulse on an iPhone simulator
        shell: bash
        run: |
          bash .github/scripts/ios-smoke.sh
