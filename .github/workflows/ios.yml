name: iPhone simulator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iphone:
    # The hosted ARM64 simulator rejected the app's verified signature during dyld startup.
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet-ios
        with:
          dotnet-version: '10.0.203'
      - name: Select Xcode and install the iOS workload
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.4.1.app/Contents/Developer
          xcodebuild -version
          dotnet workload install maui-ios --version 10.0.203.1
      - name: Build the iPhone simulator app
        run: >-
          dotnet build samples/Laveyana.Audio.Maui/Laveyana.Audio.Maui.csproj
          -c Debug
          -p:LavPulsePlatform=ios
          -p:RuntimeIdentifier=iossimulator-x64
          -p:EnableCodeSigning=false
      - name: Launch LavPulse on an iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-${sdk//./-}"
          device="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"].get(sys.argv[1], [])
          print(next(device["udid"] for device in devices if device["name"].startswith("iPhone")))
          ' "$runtime")"
          trap 'xcrun simctl shutdown "$device" || true' EXIT
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          app="$(find samples/Laveyana.Audio.Maui/bin -type d -path '*/iossimulator-x64/Laveyana.Audio.Maui.app' -print -quit)"
          test -n "$app"
          find "$app" -type f -name '*.dylib' -exec codesign --force --sign - {} \;
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          xcrun simctl install "$device" "$app"
          bundle="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")"
          launched="$(xcrun simctl launch "$device" "$bundle")"
          echo "$launched"
          pid="${launched##*: }"
          sleep 5
          if ! kill -0 "$pid"; then
            echo "::group::Simulator startup log"
            xcrun simctl spawn "$device" log show --last 3m --style compact \
              --predicate "processIdentifier == $pid OR eventMessage CONTAINS[c] '$bundle'" || true
            echo "::endgroup::"
            echo "::group::Crash reports"
            find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -name 'Laveyana.Audio.Maui*.ips' \
              -exec head -n 100 {} \; || true
            echo "::endgroup::"
            exit 1
          fi
